<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港小學數學科網上智能評估系統 | Primary Math Assessment (P1-P6)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:ital,wght@1,700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* 垂直分數樣式 (Vertical Fraction Layout) */
    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      font-size: 0.95em;
      padding: 0 4px;
      line-height: 1.05;
    }
    .frac > .num {
      border-bottom: 1.8px solid #1e293b;
      padding-bottom: 2px;
      display: block;
      font-weight: 600;
    }
    .frac > .den {
      padding-top: 2px;
      display: block;
      font-weight: 600;
    }

    /* 數學常數 π 專用字型 */
    .math-pi {
      font-family: 'Noto Serif TC', "Cambria Math", "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      padding: 0 2px;
    }

    /* 列印與匯出專用排版 */
    @media print {
      body {
        background: white !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .app-container {
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
      }
      .page-break {
        page-break-before: always;
      }
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-6 lg:p-8">
  <div class="app-container max-w-4xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 p-5 sm:p-8">
    
    <!-- 頂部標題列 -->
    <header class="text-center pb-6 mb-6 border-b border-slate-100">
      <div class="inline-flex items-center gap-2 bg-blue-50 text-blue-700 px-3.5 py-1 rounded-full text-xs sm:text-sm font-semibold mb-3 border border-blue-100">
        <span>🎒 香港小學數學課程 • 小一至小六 (P1–P6) 全級在線評估</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">小學數學科智能評估與錯題跟進系統</h1>
      <p class="text-sm sm:text-base text-slate-500 mt-2">
        涵蓋 數 (N)、度量 (M)、圖形與空間 (S)、數據處理 (D)、代數 (A) • 20 題標準診斷
      </p>
    </header>

    <!-- 提示訊息 Modal / Toast 容器 -->
    <div id="toastMessage" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all duration-300"></div>

    <!-- 1. 主選擇介面 (Selection Hub) -->
    <section id="selectionHub" class="space-y-6">
      
      <!-- 學生個人資料填寫卡片 -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-5">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-600"></span>
          學生基本資料 (Student Information)
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5" for="studentName">學生姓名 (Name) *</label>
            <input type="text" id="studentName" placeholder="例如：陳小明" 
                   class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5" for="studentClass">班別 (Class)</label>
            <input type="text" id="studentClass" placeholder="例如：6A / 5B" 
                   class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5" for="studentId">學號 (Class No.)</label>
            <input type="text" id="studentId" placeholder="例如：15" 
                   class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
          </div>
        </div>
      </div>

      <!-- 步驟 1：選擇評估年級 -->
      <div>
        <label class="block text-sm font-bold text-slate-800 mb-3">
          1. 點選評估年級 (Select Grade Level):
        </label>
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 sm:gap-3">
          <button type="button" onclick="selectGrade('P1')" id="tab_P1" class="grade-tab-btn px-3 py-2.5 text-sm font-semibold rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition">小一 (P1)</button>
          <button type="button" onclick="selectGrade('P2')" id="tab_P2" class="grade-tab-btn px-3 py-2.5 text-sm font-semibold rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition">小二 (P2)</button>
          <button type="button" onclick="selectGrade('P3')" id="tab_P3" class="grade-tab-btn px-3 py-2.5 text-sm font-semibold rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition">小三 (P3)</button>
          <button type="button" onclick="selectGrade('P4')" id="tab_P4" class="grade-tab-btn px-3 py-2.5 text-sm font-semibold rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition">小四 (P4)</button>
          <button type="button" onclick="selectGrade('P5')" id="tab_P5" class="grade-tab-btn px-3 py-2.5 text-sm font-semibold rounded-xl border border-slate-200 bg-white text-slate-700 hover:border-blue-400 hover:bg-blue-50 transition">小五 (P5)</button>
          <button type="button" onclick="selectGrade('P6')" id="tab_P6" class="grade-tab-btn px-3 py-2.5 text-sm font-semibold rounded-xl border-2 border-blue-600 bg-blue-600 text-white shadow-md transition">小六 (P6)</button>
        </div>
      </div>

      <!-- 步驟 2：選擇該年級的課題單元 -->
      <div>
        <label id="moduleSectionTitle" class="block text-sm font-bold text-slate-800 mb-3">
          2. 選取課題單元 (Select Assessment Unit):
        </label>
        <div id="moduleCardContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- 動態載入單元卡片 -->
        </div>
      </div>

      <!-- 開始測驗按鈕 -->
      <button type="button" onclick="startAssessment()" 
              class="w-full py-4 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-base sm:text-lg font-bold rounded-xl shadow-lg shadow-blue-500/25 transition duration-200 flex items-center justify-center gap-2">
        <span>🎯 開始 20 題標準測驗 (Start 20-Question Assessment)</span>
      </button>
    </section>

    <!-- 2. 測驗作答進行介面 (Assessment Area) -->
    <section id="assessmentArea" class="hidden space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 bg-blue-50 border border-blue-200 rounded-xl p-4">
        <div>
          <span id="assessmentStatusText" class="font-bold text-blue-900 text-base">測驗進行中</span>
          <p id="assessmentModuleSub" class="text-xs text-blue-700 mt-0.5"></p>
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-blue-200/70 text-blue-900 font-semibold px-3 py-1 rounded-lg text-xs">共 20 題 • 滿分 100 分</span>
        </div>
      </div>

      <div id="questionsContainer" class="space-y-5">
        <!-- 動態渲染 20 道題目卡片 -->
      </div>

      <div class="pt-4 border-t border-slate-200">
        <button type="button" onclick="submitAssessment()" 
                class="w-full py-4 px-6 bg-emerald-600 hover:bg-emerald-700 text-white text-lg font-bold rounded-xl shadow-lg shadow-emerald-600/25 transition duration-200 flex items-center justify-center gap-2">
          <span>📝 確認提交 20 題試卷 (Submit Assessment)</span>
        </button>
      </div>
    </section>

    <!-- 3. 結果與五大範疇診斷報告介面 (Result & Diagnostic Dashboard) -->
    <section id="resultArea" class="hidden space-y-6">
      
      <!-- 總分卡片 -->
      <div class="bg-gradient-to-br from-emerald-500 to-teal-700 text-white rounded-2xl p-6 sm:p-8 text-center shadow-lg relative overflow-hidden">
        <div class="relative z-10">
          <span class="text-emerald-100 font-semibold text-sm uppercase tracking-wider">評估成績診斷結果</span>
          <div id="scoreDisplay" class="text-4xl sm:text-5xl font-extrabold my-2 tracking-tight">-- / 100</div>
          <div id="gradeBandDisplay" class="inline-block bg-white/20 backdrop-blur-md px-4 py-1.5 rounded-full text-sm sm:text-base font-bold mt-1">--</div>
          <div id="studentDetailTag" class="text-xs sm:text-sm text-emerald-100 mt-3 font-medium"></div>
        </div>
      </div>

      <!-- 五大範疇得分率長條圖診斷 -->
      <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 shadow-sm">
        <h3 class="text-base font-bold text-slate-900 pb-3 border-b border-slate-100 flex items-center justify-between">
          <span class="flex items-center gap-2">
            <span class="text-xl">📊</span> 數學五大範疇掌握度診斷報告
          </span>
          <span class="text-xs font-normal text-slate-500">標準參照評估</span>
        </h3>
        <div id="strandAnalysisBars" class="space-y-4 my-5">
          <!-- 動態長條圖 -->
        </div>
        <div id="diagnosticFeedbackBox" class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm text-slate-700 leading-relaxed">
          <!-- 動態診斷建議 -->
        </div>
      </div>

      <!-- 快捷行動按鈕 (錯題跟進練習 & 列印/複製成績) -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 no-print">
        <button type="button" id="remediationActionBtn" onclick="launchRemediationQuiz()" 
                class="hidden py-3.5 px-4 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm sm:text-base sm:col-span-3">
          <span>💡 一按生成錯題跟進練習 (Generate Remediation Practice)</span>
        </button>
        <button type="button" onclick="window.print()" 
                class="py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl text-sm transition flex items-center justify-center gap-2">
          <span>🖨️ 列印 / 匯出 PDF</span>
        </button>
        <button type="button" onclick="copyReportText()" 
                class="py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold rounded-xl text-sm transition border border-slate-200 flex items-center justify-center gap-2">
          <span>📋 複製成績報告</span>
        </button>
        <button type="button" onclick="returnToSelectionHub()" 
                class="py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition flex items-center justify-center gap-2">
          <span>🔄 返回單元主頁</span>
        </button>
      </div>

      <!-- 20 題詳細題解與步驟清單 -->
      <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 shadow-sm">
        <h3 class="text-base font-bold text-slate-900 pb-3 border-b border-slate-100 flex items-center gap-2 mb-4">
          <span class="text-xl">🔍</span> 逐題批改詳情與步驟解析
        </h3>
        <div id="detailedReviewContainer" class="space-y-4">
          <!-- 動態解析項目 -->
        </div>
      </div>

    </section>

  </div>

  <script>
    /* =========================================================================
     * 香港小學數學課程模組定義 (小一至小六 P1–P6 完整學習範疇綱要)
     * ========================================================================= */
    const CURRICULUM_DATA = {
      'P1': [
        { key: 'p1_all', title: '【小一全頁綜合評估】(20題涵蓋各範疇)' },
        { key: 'p1_add_sub_18', title: '數 (N)：18以內的加法和不退位減法 (P1上)' },
        { key: 'p1_num_100', title: '數 (N)：100以內的數與兩位數運算 (P1下)' },
        { key: 'p1_time_money', title: '度量 (M)：香港硬幣換值與鐘面讀法 (時/半時)' },
        { key: 'p1_shape_space', title: '圖形與空間 (S)：平面與立體圖形辨認及空間方位' }
      ],
      'P2': [
        { key: 'p2_all', title: '【小二全頁綜合評估】(20題涵蓋各範疇)' },
        { key: 'p2_mul_div', title: '數 (N)：九九乘法表與有餘數除法' },
        { key: 'p2_3digit_calc', title: '數 (N)：3位數加減法 (含退位與進位)' },
        { key: 'p2_measure_len', title: '度量 (M)：長度 (cm/m) 與貨幣找續應用' },
        { key: 'p2_quad_dir', title: '圖形與空間 (S)：四邊形、角與東南西北' },
        { key: 'p2_data_pict', title: '數據處理 (D)：象形圖分析 (一格代表1個單位)' }
      ],
      'P3': [
        { key: 'p3_all', title: '【小三全頁綜合評估】(20題涵蓋各範疇)' },
        { key: 'p3_four_ops', title: '數 (N)：四則混合運算與多位數乘除' },
        { key: 'p3_frac_basic', title: '數 (N)：同分母分數比較與基礎概念' },
        { key: 'p3_measure_units', title: '度量 (M)：容量 (L/mL)、重量 (g/kg) 與24小時制' },
        { key: 'p3_tri_8dir', title: '圖形與空間 (S)：三角形分類與八個方向' },
        { key: 'p3_data_block', title: '數據處理 (D)：方塊圖分析' }
      ],
      'P4': [
        { key: 'p4_all', title: '【小四全頁綜合評估】(20題涵蓋各範疇)' },
        { key: 'p4_frac_add_sub', title: '數 (N)：同分母分數加減法與假帶互化' },
        { key: 'p4_dec_basic', title: '數 (N)：小數認識與小數加減運算' },
        { key: 'p4_factor_multiple', title: '數 (N)：因數、倍數、公因數、公倍數與質數' },
        { key: 'p4_perim_area', title: '度量 (M)：長方形與正方形周界與面積 (cm²/m²)' },
        { key: 'p4_data_bar', title: '數據處理 (D)：棒形圖閱讀與分析' }
      ],
      'P5': [
        { key: 'p5_all', title: '【小五全頁綜合評估】(20題涵蓋五大範疇)' },
        { key: 'p5_frac_add_sub', title: '數 (N)：異分母分數加減法' },
        { key: 'p5_frac_mul_div', title: '數 (N)：分數乘法與除法應用' },
        { key: 'p5_dec_calc', title: '數 (N)：小數乘除法與四則混合運算' },
        { key: 'p5_area_calc', title: '度量 (M)：平行四邊形、三角形與梯形面積' },
        { key: 'p5_vol_measure', title: '度量 (M)：長方體/正方體體積與排水法' },
        { key: 'p5_shape_dir', title: '圖形與空間 (S)：立體頂棱面與八個方向應用' },
        { key: 'p5_avg_data', title: '數據處理 (D)：平均數與複合棒形圖分析' },
        { key: 'p5_algebra_intro', title: '代數 (A)：代數符號與簡易方程解題' }
      ],
      'P6': [
        { key: 'p6_all', title: '【小六全頁綜合評估】(20題涵蓋五大範疇)' },
        { key: 'p6_pct_calc', title: '數 (N)：百分數互化、折扣、賺蝕與增減百分率' },
        { key: 'p6_circle_measure', title: '度量 (M)：圓周與圓面積計算 (π 應用)' },
        { key: 'p6_speed_graph', title: '度量 (M)：速率、時間、距離與行程問題' },
        { key: 'p6_algebra_adv', title: '代數 (A)：兩步/括號簡易方程與文字應用題' },
        { key: 'p6_data_graph', title: '數據處理 (D)：圓形圖、折線圖與加權平均' },
        { key: 'p6_shape_symmetry', title: '圖形與空間 (S)：旋轉對稱與立體摺紙展開圖' }
      ]
    };

    let currentGrade = 'P6';
    let currentSelectedModule = 'p6_all';
    let currentQuestions = [];
    let currentReviewList = [];
    let currentMistakes = [];
    let inputModeMap = {}; // qId -> 'normal' | 'fraction'

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    function lcm(a, b) {
      return (a * b) / gcd(a, b);
    }

    /* LaTeX 數學排版與符號渲染器 */
    function formatMath(str) {
      if (!str && str !== 0) return '';
      let text = String(str);

      // 標準 π 符號置換
      text = text.replace(/\\pi\b/g, '<span class="math-pi">π</span>');
      text = text.replace(/\bPI\b/g, '<span class="math-pi">π</span>');
      text = text.replace(/\\times/g, ' × ');
      text = text.replace(/\\div/g, ' ÷ ');
      text = text.replace(/\\text\{([^}]+)\}/g, '$1');
      text = text.replace(/\\implies/g, ' ⇒ ');
      text = text.replace(/\\%/g, '%');
      text = text.replace(/\$/g, '');

      // 帶分數垂直渲染
      text = text.replace(/(\d+)\s*\\frac\{([^{}]+)\}\{([^{}]+)\}/g, function(_, whole, num, den) {
        return `<strong>${whole}</strong> <span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
      });

      // 真/假分數垂直渲染
      text = text.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, function(_, num, den) {
        return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
      });

      return text;
    }

    function formatAnswerDisplay(ans) {
      if (!ans && ans !== 0) return '<span class="text-slate-400 italic">未作答</span>';
      let s = String(ans).trim();

      const mixed = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
      if (mixed) {
        return `<strong>${mixed[1]}</strong> <span class="frac"><span class="num">${mixed[2]}</span><span class="den">${mixed[3]}</span></span>`;
      }

      if (s.includes('/') && !s.includes('<span')) {
        const parts = s.split('/');
        if (parts.length === 2) {
          return `<span class="frac"><span class="num">${parts[0]}</span><span class="den">${parts[1]}</span></span>`;
        }
      }
      return formatMath(s);
    }

    function generateSingleQuestion(grade, moduleKey, index) {
      const qId = 'Q_' + grade + '_' + Date.now() + '_' + index + '_' + getRandomInt(100, 999);

      // ===================== 【小學六年級 (P6)】 =====================
      if (grade === 'P6') {
        if (moduleKey === 'p6_pct_calc') {
          const type = getRandomInt(0, 3);
          if (type === 0) {
            const p = getRandomItem([120, 150, 180, 240, 250, 300, 360, 480, 500, 640]);
            const d = getRandomItem([70, 75, 80, 85, 90]);
            const dNames = { 70: '七折', 75: '七五折', 80: '八折', 85: '八五折', 90: '九折' };
            const ans = (p * d) / 100;
            return {
              id: qId, grade: 'P6', strand: '數 (N)', topic: '百分數與折扣應用',
              text: `一件外套原價 ${p} 元，百貨公司現以【${dNames[d]}】出售，售價是多少元？`,
              correctAnswer: String(ans), points: 5,
              explanation: `售價 $= ${p} \\times ${d}\\% = ${p} \\times ${d / 100} = ${ans}$ 元。`
            };
          } else if (type === 1) {
            const c = getRandomItem([80, 100, 120, 150, 200, 250, 320]);
            const pct = getRandomItem([10, 15, 20, 25, 30]);
            const ans = c * (1 + pct / 100);
            return {
              id: qId, grade: 'P6', strand: '數 (N)', topic: '百分數與賺蝕應用',

    function generateQuiz(grade, moduleKey, count = 20) {
      const questions = [];
      const modules = CURRICULUM_DATA[grade] || [];
      let availableKeys = modules.map(m => m.key).filter(k => !k.endsWith('_all'));
      if (availableKeys.length === 0) availableKeys = ['p6_pct_calc', 'p6_circle_measure', 'p6_speed_graph', 'p6_algebra_adv'];

      for (let i = 0; i < count; i++) {
        let currentKey = moduleKey;
        if (!currentKey || currentKey.endsWith('_all')) {
          currentKey = availableKeys[i % availableKeys.length];
        }
        const q = generateSingleQuestion(grade, currentKey, i + 1);
        questions.push(q);
      }
      return questions;
    }

    function parseValue(str) {
      if (!str && str !== 0) return null;
      const s = String(str).trim();
      if (!isNaN(Number(s))) return Number(s);

      const mixed = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
      if (mixed) {
        const w = Number(mixed[1]), n = Number(mixed[2]), d = Number(mixed[3]);
        if (d !== 0) return w + (n / d);
      }

      if (s.includes('/')) {
        const parts = s.split('/');
        if (parts.length === 2) {
          const n = Number(parts[0]), d = Number(parts[1]);
          if (!isNaN(n) && !isNaN(d) && d !== 0) return n / d;
        }
      }
      return null;
    }

    function checkAnswerCorrectness(userAns, correctAns) {
      if (!userAns && userAns !== 0) return false;
      const u = String(userAns).trim().toLowerCase().replace(/面$/, '').replace(/方向$/, '');
      const c = String(correctAns).trim().toLowerCase().replace(/面$/, '').replace(/方向$/, '');
      if (u === c) return true;

      const uNum = parseValue(u);
      const cNum = parseValue(c);
      if (uNum !== null && cNum !== null) {
        return Math.abs(uNum - cNum) < 0.001;
      }
      return false;
    }

    function submitAssessment() {
      let rawScore = 0;
      let maxScore = 0;
      const reviewList = [];

      const strandStats = {
        '數 (N)': { total: 0, earned: 0 },
        '度量 (M)': { total: 0, earned: 0 },
        '圖形與空間 (S)': { total: 0, earned: 0 },
        '數據處理 (D)': { total: 0, earned: 0 },
        '代數 (A)': { total: 0, earned: 0 }
      };

      currentQuestions.forEach(q => {
        let userAns = '';
        const mode = inputModeMap[q.id] || 'normal';

        if (mode === 'fraction') {
          const w = document.getElementById(`whole_${q.id}`).value.trim();
          const n = document.getElementById(`num_${q.id}`).value.trim();
          const d = document.getElementById(`den_${q.id}`).value.trim();

          if (w && n && d) userAns = `${w} ${n}/${d}`;
          else if (n && d) userAns = `${n}/${d}`;
          else if (w && !n && !d) userAns = w;
          else if (n && !d && !w) userAns = n;
        } else {
          const normalInput = document.getElementById(`ans_${q.id}`);
          if (normalInput) userAns = normalInput.value.trim();
        }

        const pts = q.points || 5;
        maxScore += pts;

        const strand = q.strand || '數 (N)';
        if (!strandStats[strand]) strandStats[strand] = { total: 0, earned: 0 };
        strandStats[strand].total += pts;

        const isCorrect = checkAnswerCorrectness(userAns, q.correctAnswer);
        if (isCorrect) {
          rawScore += pts;
          strandStats[strand].earned += pts;
        }

        reviewList.push({
          id: q.id,
          grade: q.grade,
          strand: strand,
          topic: q.topic,
          text: q.text,
          userAnswer: userAns,
          correctAnswer: q.correctAnswer,
          isCorrect: isCorrect,
          pointsEarned: isCorrect ? pts : 0,
          maxPoints: pts,
          explanation: q.explanation
        });
      });

      currentReviewList = reviewList;
      currentMistakes = reviewList.filter(r => !r.isCorrect);

      const percentage = maxScore > 0 ? (rawScore / maxScore) * 100 : 0;
      let gradeBand = '需加強 (Needs Improvement)';
      if (percentage >= 85) gradeBand = '優良 (Distinction)';
      else if (percentage >= 70) gradeBand = '良好 (Merit)';
      else if (percentage >= 50) gradeBand = '及格 (Pass)';

      const strandAnalysis = [];
      const strengths = [];
      const weaknesses = [];

      for (const [sName, sData] of Object.entries(strandStats)) {
        if (sData.total > 0) {
          const pct = Math.round((sData.earned / sData.total) * 100);
          strandAnalysis.push({ strand: sName, percentage: pct, earned: sData.earned, total: sData.total });
          if (pct >= 80) strengths.push(sName);
          else if (pct < 60) weaknesses.push(sName);
        }
      }

      displayResults({
        rawScore,
        maxScore,
        percentage: percentage.toFixed(1),
        gradeBand,
        strandAnalysis,
        strengths,
        weaknesses,
        reviews: reviewList
      });
    }

        '小數四則混合運算': 'p5_dec_calc',
        '平行四邊形面積': 'p5_area_calc',
        '三角形面積': 'p5_area_calc',
        '梯形面積': 'p5_area_calc',
        '排水法測量不規則立體體積': 'p5_vol_measure',
        '平均數計算': 'p5_avg_data',
        '簡易方程解題': 'p5_algebra_intro',
        '百分數與折扣應用': 'p6_pct_calc',
        '百分數與賺蝕應用': 'p6_pct_calc',
        '增減百分率': 'p6_pct_calc',
        '分數小數百分數混合計算': 'p6_pct_calc',
        '圓周計算': 'p6_circle_measure',
        '圓面積計算': 'p6_circle_measure',
        '半圓形周界計算': 'p6_circle_measure',
        '速率公式應用': 'p6_speed_graph',
        '行程距離計算': 'p6_speed_graph',
        '速率單位換算': 'p6_speed_graph',
        '帶括號的簡易方程': 'p6_algebra_adv',
        '含分數的簡易方程': 'p6_algebra_adv',
        '簡易方程文字應用題': 'p6_algebra_adv',
        '圓形圖數據分析': 'p6_data_graph',
        '對稱與立體展開圖': 'p6_shape_symmetry'
      };

      currentMistakes.forEach((m, idx) => {
        const modKey = topicToModuleMap[m.topic] || 'p6_pct_calc';
        const newQ = generateSingleQuestion(m.grade || currentGrade, modKey, idx + 1);
        newQ.text = `【針對性錯題鞏固練習】` + newQ.text;
        followUpQuestions.push(newQ);
      });

      currentQuestions = followUpQuestions;
      inputModeMap = {};

      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('assessmentArea').classList.remove('hidden');

      document.getElementById('assessmentStatusText').innerText = `錯題跟進強化練習 (共 ${followUpQuestions.length} 題)`;
      document.getElementById('assessmentModuleSub').innerText = '根據剛才測驗中答錯的知識點，自動生成的針對性鞏固題目';

      renderAssessmentQuestions(currentQuestions);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function returnToSelectionHub() {
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('assessmentArea').classList.add('hidden');
      document.getElementById('selectionHub').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyReportText() {
      const sName = document.getElementById('studentName').value.trim() || '學生';
      const sClass = document.getElementById('studentClass').value.trim();
      const sId = document.getElementById('studentId').value.trim();
      const score = document.getElementById('scoreDisplay').innerText;
      const grade = document.getElementById('gradeBandDisplay').innerText;

      const report = `【香港小學數學科在線評估成績報告】\n` +
        `學生姓名：${sName}\n` +
        `班別 / 學號：${sClass || '--'} / ${sId || '--'}\n` +
        `評估年級：${currentGrade}\n` +
        `測驗總分：${score}\n` +
        `${grade}\n` +
        `評估時間：${new Date().toLocaleString('zh-HK')}\n` +
        `系統網址：GitHub Pages 在線評估版`;

      const dummy = document.createElement('textarea');
      document.body.appendChild(dummy);
      dummy.value = report;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      showToast('✅ 成績報告文字已複製至剪貼簿！可直接貼在 WhatsApp 或 Google Classroom。', 'success');
    }

    window.onload = function() {
      selectGrade('P6');
    };
  </script>
